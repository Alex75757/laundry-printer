name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 1. Сборка (на облачном Windows или на машине А)
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build
        working-directory: laundry-printer
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: laundry-printer-exe
          path: laundry-printer/target/x86_64-pc-windows-msvc/release/laundry-printer.exe

  # 2. Деплой на машину Б (self-hosted)
  deploy:
    needs: build
    runs-on: [self-hosted, Windows, printer-host] # ← метка runner'а
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: laundry-printer-exe
          path: C:\Laundry\bin

      - name: Restart via Task Scheduler
        shell: pwsh
        run: |
          schtasks /end /tn "LaundryPrinter" 2>$null
          Get-Process laundry-printer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          schtasks /run /tn "LaundryPrinter"
