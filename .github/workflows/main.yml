name: Build & Deploy with powershell

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ── Сборка на облачном Windows ──
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: laundry-tools-windows
          path: target/x86_64-pc-windows-msvc/release/*.exe

  # ── Деплой на машину Б (self-hosted runner) ──
  deploy:
    needs: build-windows
    runs-on: [self-hosted, Windows, printer-host]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: laundry-tools-windows
          path: C:\Laundry\bin

      - name: Stop old process
        shell: cmd
        run: |
          schtasks /end /tn "LaundryPrinter" 2>$null
          Get-Process laundry-printer -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

      - name: Start via Task Scheduler
        shell: cmd
        run: |
          schtasks /run /tn "LaundryPrinter"
          Start-Sleep -Seconds 3
          $p = Get-Process laundry-printer -ErrorAction SilentlyContinue
          if (-not $p) { throw "laundry-printer did not start" }
          Write-Host "laundry-printer started, PID=$($p.Id)"
